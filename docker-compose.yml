# Two services sharing the same archive volume:
#   archiver  - live capture (restarts automatically, including on host boot
#               if the Docker daemon is enabled at startup)
#   dashboard - read-only web UI on http://localhost:8080
#
# Put DISCORD_BOT_TOKEN / DISCORD_GUILD_ID (and optional MIRROR_*) in a `.env`
# file next to this file, or switch env_file to `environment:` entries.
services:
  archiver:
    build: .
    env_file: .env
    volumes:
      - ./data:/data
    restart: unless-stopped

  dashboard:
    build: .
    env_file: .env
    volumes:
      - ./data:/data
    ports:
      - "8080:8080"
    restart: unless-stopped
    command: ["python", "main.py", "dashboard", "--port", "8080"]
